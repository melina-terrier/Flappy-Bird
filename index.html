<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <meta name="description" content="Clone de Flappy Bird en JavaScript / PIXI.js — TD de Programmation Orientée Objet.">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Open Graph (partage réseaux sociaux) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Flappy Bird">
    <meta property="og:description" content="Clone de Flappy Bird en JavaScript / PIXI.js — TD de POO.">
    <meta property="og:image" content="assets/favicon.svg">

    <style>
        /* Police pixel auto-hébergée (fonctionne hors-ligne) */
        @font-face {
            font-family: 'Press Start 2P';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('assets/fonts/press-start-2p.woff2') format('woff2');
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(160deg, #1b2735 0%, #090a0f 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none; /* pas de zoom / scroll au toucher sur mobile */
        }
        canvas {
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            display: block;
            touch-action: none;
        }
    </style>

    <!-- PIXI.js auto-hébergé (pas de dépendance CDN) -->
    <script src="vendor/pixi.min.js"></script>
</head>
<body>
    <script type="module" src="js/main.js"></script>
</body>
</html>
